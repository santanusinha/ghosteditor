[package]
name = "ghostedit"
version = "0.1.0"
edition = "2021"
description = "A headless editor MCP: file ops plus direct LSP, no editor, no hangs"
license = "MIT"

[lib]
name = "ghostedit"
path = "src/lib.rs"

[[bin]]
name = "ghostedit"
path = "src/main.rs"

[workspace]
members = ["xtask"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lsp-types = "0.97"

[dev-dependencies]
tempfile = "3"
