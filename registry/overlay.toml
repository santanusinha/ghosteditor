# ghostedit registry overlay — the only hand-maintained registry file.
#
# mason-registry owns "how to install" (versions, purls, assets, exe names).
# This file owns "how to launch": language key, extensions, launch args, and
# which extensions route to the server by default when no config entry exists.
#
# Fields per [[server]]:
#   name        mason package name (required, merge key)
#   language    config-style language key (default: first mason language)
#   extensions  file extensions this server handles
#   args        launch args after the binary (e.g. ["--stdio"])
#   default_for extensions that route here when config has no entry
#   bin         force an exe name (for exotic mason templates)
#   supported   pin off (false = manual install only)
#
# Servers without an entry here stay installable via install_server but are
# never auto-routed; user config [languages.X] command launches them.

[[server]]
name = "pyright"
language = "python"
extensions = [".py", ".pyi"]
args = ["--stdio"]
default_for = [".py"]

[[server]]
name = "python-lsp-server"
language = "python"
extensions = [".py", ".pyi"]
args = []

