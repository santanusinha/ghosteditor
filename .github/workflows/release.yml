name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  static-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build the static binary
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Smoke test
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/ghostedit
          file "$BIN" | grep -q "statically linked"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | timeout 10 "$BIN" --cwd . | grep -q serverInfo
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="ghostedit-${VERSION}-linux-x86_64"
          mkdir "$DIR"
          cp target/x86_64-unknown-linux-gnu/release/ghostedit "$DIR/"
          cp README.md LICENSE CHANGELOG.md "$DIR/"
          strip "$DIR/ghostedit"
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ghostedit-*-linux-x86_64.tar.gz
            ghostedit-*-linux-x86_64.tar.gz.sha256
